<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodBridge</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">
                <i class="fas fa-heart"></i>
            </div>
            <h2>Create Account 🚀</h2>
            <p class="subtitle">Join FoodBridge and help reduce food waste</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>🔒 Password (min 6 characters)</label>
                    <input type="password" id="password" placeholder="••••••" required minlength="6">
                </div>

                <div class="form-group">
                    <label>🎯 I want to register as</label>
                    <select id="role" required>
                        <option value="">Select your role</option>
                        <option value="restaurant">🏪 Restaurant (Donate Food)</option>
                        <option value="ngo">🤝 NGO (Receive Food)</option>
                        <option value="volunteer">🚚 Volunteer (Deliver Food)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📱 Phone Number</label>
                    <input type="tel" id="phone" placeholder="+91 9876543210" required>
                </div>

                <div class="form-group">
                    <label>📍 Address</label>
                    <textarea id="address" placeholder="Enter your complete address" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <p style="text-align:center;margin-top:1.5rem;color:#64748b;">
                    Already registered? <a href="/pages/login.html" class="link">Login here</a>
                </p>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Creating your account...</p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        if (authManager.isAuthenticated()) {
            window.location.href = authManager.getDashboardUrl();
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            showLoading();
            this.style.opacity = '0.7';

            const userData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim()
            };

            try {
                await authManager.register(userData);
                showAlert('✅ Account created! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = authManager.getDashboardUrl();
                }, 1500);
            } catch (error) {
                showAlert('❌ ' + error.message, 'error');
            } finally {
                hideLoading();
                this.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
